plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'cn.routelab.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.routelab.mobile'
        minSdk 28
        targetSdk 35
        versionCode 18
        versionName '1.9.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
